<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>premiere</title>
    <style>
        body{
            margin: 0;
            background-color: rgb(117, 173, 234);
        } 

        .header{
            background-color: white;
            color: black;
            padding: 10px;
        }
        
        .nav{
            display: flex;
                gap: 10px;
        }               
              
        .nav-box{
            display: flex;
            justify-content: center;
        }
           
          .fl1{
            background-color: blue;
            color: white;
            height: 30px;
          }
          .fl2{
            background-color: rgb(119, 255, 0);
            color: white;
            height: 30px;
          }
          .dv-1{
            display: flex;
            height: 100px;
            justify-content:space-around;
            align-items:center ;
            background-color: rgb(215, 179, 119);
          }
          .btn-add{
            background-color: rgb(199, 112, 12);
            color: white;
            border: none;
            width: 200px;
            height: 100px;
            margin-top: 10px;
            border-radius: 5px;
            box-shadow: 5px 2px 20px rgb(89, 225, 98);
          }
          .btn-add:hover{
            cursor:pointer;
            background-color: green;
            border-top-left-radius: 100px;
            border-bottom-right-radius: 100px;
            transition:0.7s;
          }
          .btn-add:active{
            margin-left: 500px;
          }
          .inp-nom{
            width: 200px;
            height: 30px;
            border-radius: 5px;
            border: none;
          }
          .inp-nom:hover{
            border: 2px solid blue;
          }
          .img-logo{
            width: 100px;
            height: 100px;
          }
          .img-logo:hover{
           cursor:pointer;
           width: 110px;
           height: 110px;
           transition: 0.5s;
          }
    </style>
</head>
<body>
        <header class="header">
            <div class="nav-box">
                <nav class="nav">
                       <img src="logo.png" alt="Logo" style="width: 15px; height: 15px;">
                        <div>store</div> 
                        <div>Mac</div>
                        <div>ipad </div>
                        <div>iphone</div>
                        <div>watch</div>
                        <div>vision</div>
                        <div>airpods</div> 
                        <div>tv & home</div>
                        <div>entertainment</div>
                        <div>accessories</div>
                        <img src="téléchargement.png" alt="Search" style="width: 15px; height: 15px;">
                    </nav>
                </nav>
            </div>
    </header>
    <div class="dv-1">
        <div class="fl1">flex1</div>
        <div class="fl2">flex2</div>
    </div>
    <button class="btn-add">add to cart</button>
    <input class="inp-nom" type="text" placeholder="ekri non w">
    <div><img class="img-logo" src="logo-instagram.png" alt=""></div>
</body>
</html>
